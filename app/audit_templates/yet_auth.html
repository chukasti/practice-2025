<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Bank - Уже авторизованы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e0e0e0;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .background-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 245, 255, 0.1), transparent);
            animation: drift 25s infinite ease-in-out;
        }

        .floating-shape:nth-child(1) {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .floating-shape:nth-child(2) {
            width: 300px;
            height: 300px;
            top: 50%;
            right: -50px;
            animation-delay: 8s;
        }

        .floating-shape:nth-child(3) {
            width: 250px;
            height: 250px;
            bottom: -50px;
            left: 30%;
            animation-delay: 4s;
        }

        @keyframes drift {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }
            33% {
                transform: translate(60px, -60px) scale(1.2);
                opacity: 0.5;
            }
            66% {
                transform: translate(-40px, 40px) scale(0.9);
                opacity: 0.4;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 550px;
            width: 100%;
            background: rgba(13, 27, 42, 0.85);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 30px;
            border: 1px solid rgba(0, 245, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 50px rgba(0, 245, 255, 0.15);
            text-align: center;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .icon-container {
            margin-bottom: 30px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .icon {
            font-size: 5em;
            filter: drop-shadow(0 0 30px rgba(0, 245, 255, 0.6));
        }

        h1 {
            font-size: 2em;
            background: linear-gradient(135deg, #00f5ff, #0080ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                filter: brightness(1);
            }
            to {
                filter: brightness(1.3);
            }
        }

        .message {
            font-size: 1.2em;
            color: #8ba3b8;
            margin-bottom: 30px;
            line-height: 1.6;
            padding: 20px;
            background: rgba(0, 245, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(0, 245, 255, 0.2);
            animation: fadeIn 0.8s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .info-box {
            background: rgba(0, 245, 255, 0.08);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(0, 245, 255, 0.25);
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.5s both;
        }

        .info-box p {
            color: #a0b5c8;
            font-size: 1em;
            margin: 8px 0;
        }

        .info-box strong {
            color: #00f5ff;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.8s ease-out 0.7s both;
        }

        .neon-button {
            padding: 18px 40px;
            font-size: 1.15em;
            font-weight: 600;
            color: #00f5ff;
            background: transparent;
            border: 2px solid #00f5ff;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3),
                        inset 0 0 20px rgba(0, 245, 255, 0.1);
            text-decoration: none;
            display: inline-block;
        }

        .neon-button:hover {
            background: rgba(0, 245, 255, 0.15);
            box-shadow: 0 0 40px rgba(0, 245, 255, 0.6),
                        inset 0 0 30px rgba(0, 245, 255, 0.2);
            transform: translateY(-3px);
        }

        .neon-button:active {
            transform: translateY(-1px);
        }

        .neon-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 245, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .neon-button:hover::before {
            width: 400px;
            height: 400px;
        }

        .neon-button span {
            position: relative;
            z-index: 1;
        }

        .logout-button {
            border-color: #ff4757;
            color: #ff4757;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.3),
                        inset 0 0 20px rgba(255, 71, 87, 0.1);
        }

        .logout-button:hover {
            background: rgba(255, 71, 87, 0.15);
            box-shadow: 0 0 40px rgba(255, 71, 87, 0.6),
                        inset 0 0 30px rgba(255, 71, 87, 0.2);
        }

        .logout-button::before {
            background: rgba(255, 71, 87, 0.3);
        }

        .home-button {
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3),
                        inset 0 0 20px rgba(0, 255, 136, 0.1);
        }

        .home-button:hover {
            background: rgba(0, 255, 136, 0.15);
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.6),
                        inset 0 0 30px rgba(0, 255, 136, 0.2);
        }

        .home-button::before {
            background: rgba(0, 255, 136, 0.3);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.3), transparent);
            margin: 25px 0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 1.6em;
            }

            .icon {
                font-size: 4em;
            }

            .message {
                font-size: 1.05em;
            }

            .neon-button {
                padding: 15px 30px;
                font-size: 1.05em;
            }
        }
    </style>
</head>
<body>
    <div class="background-effect">
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
    </div>

    <div class="container">
        <div class="icon-container">
            <div class="icon">🔐</div>
        </div>

        <h1>Вы уже авторизованы</h1>

        <div class="message">
            Вы уже вошли в систему. Для повторной авторизации необходимо сначала выйти из текущего аккаунта.
        </div>

        <div class="info-box">
            <p>💡 <strong>Что можно сделать:</strong></p>
            <p>→ Перейти в личный кабинет</p>
            <p>→ Выйти из текущего аккаунта</p>
            <p>→ Продолжить работу с системой</p>
        </div>

        <div class="divider"></div>

        <div class="button-group">
            <a href="/home" class="neon-button home-button">
                <span>🏠 Перейти в личный кабинет</span>
            </a>
            
            <button type="button" class="neon-button logout-button" onclick="logout()">
                <span>🚪 Выйти из аккаунта</span>
            </button>
        </div>
    </div>

    <script>
        async function logout() {
            const button = event.target.closest('button');
            const originalText = button.innerHTML;
            
            // Визуальная обратная связь
            button.disabled = true;
            button.style.opacity = '0.6';
            button.innerHTML = '<span>⏳ Выход...</span>';
            
            try {
                const response = await fetch("/api/logout", {
                    method: "POST",
                    credentials: "include"
                });
                
                if (response.ok) {
                    button.innerHTML = '<span>✅ Успешно!</span>';
                    
                    // Анимация успешного выхода
                    setTimeout(() => {
                        window.location.href = "/login";
                    }, 800);
                } else {
                    throw new Error('Ошибка при выходе');
                }
            } catch (error) {
                button.disabled = false;
                button.style.opacity = '1';
                button.innerHTML = originalText;
                
                // Показываем ошибку
                const errorDiv = document.createElement('div');
                errorDiv.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: rgba(255, 71, 87, 0.2);
                    border: 2px solid #ff4757;
                    color: #ff6b7a;
                    padding: 15px 25px;
                    border-radius: 15px;
                    box-shadow: 0 0 30px rgba(255, 71, 87, 0.3);
                    animation: slideIn 0.5s ease-out;
                    z-index: 1000;
                `;
                errorDiv.textContent = '❌ Ошибка при выходе. Попробуйте снова.';
                document.body.appendChild(errorDiv);
                
                setTimeout(() => {
                    errorDiv.style.animation = 'fadeOut 0.5s ease-out';
                    setTimeout(() => errorDiv.remove(), 500);
                }, 3000);
            }
        }

        // Добавляем анимацию при наведении на кнопки
        document.querySelectorAll('.neon-button').forEach(button => {
            button.addEventListener('mouseenter', function() {
                this.style.transition = 'all 0.3s ease';
            });
        });

        // Эффект параллакса для фона
        document.addEventListener('mousemove', (e) => {
            const shapes = document.querySelectorAll('.floating-shape');
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;
            
            shapes.forEach((shape, index) => {
                const speed = (index + 1) * 20;
                const x = (mouseX - 0.5) * speed;
                const y = (mouseY - 0.5) * speed;
                
                shape.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
