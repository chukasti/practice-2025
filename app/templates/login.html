<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Bank - Авторизация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e0e0e0;
            position: relative;
            overflow: hidden;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 245, 255, 0.1), transparent);
            animation: drift 30s infinite ease-in-out;
        }

        .circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 200px;
            height: 200px;
            top: 60%;
            right: 15%;
            animation-delay: 5s;
        }

        .circle:nth-child(3) {
            width: 400px;
            height: 400px;
            bottom: 10%;
            left: 50%;
            animation-delay: 10s;
        }

        @keyframes drift {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(50px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-30px, 30px) scale(0.9);
            }
        }

        .login-container {
            position: relative;
            z-index: 1;
            max-width: 450px;
            width: 90%;
            padding: 50px 40px;
            background: rgba(13, 27, 42, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(0, 245, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(0, 245, 255, 0.1);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #00f5ff, #0080ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                filter: brightness(1) drop-shadow(0 0 10px rgba(0, 245, 255, 0.5));
            }
            to {
                filter: brightness(1.3) drop-shadow(0 0 20px rgba(0, 245, 255, 0.8));
            }
        }

        .logo p {
            color: #8ba3b8;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 25px;
            animation: fadeIn 0.6s ease-out backwards;
        }

        .form-group:nth-child(1) {
            animation-delay: 0.2s;
        }

        .form-group:nth-child(2) {
            animation-delay: 0.3s;
        }

        .form-group:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #8ba3b8;
            font-weight: 500;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 245, 255, 0.2);
            border-radius: 15px;
            color: #e0e0e0;
            font-size: 1em;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #00f5ff;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        .neon-button {
            width: 100%;
            padding: 16px;
            font-size: 1.1em;
            font-weight: 600;
            color: #00f5ff;
            background: transparent;
            border: 2px solid #00f5ff;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3),
                        inset 0 0 20px rgba(0, 245, 255, 0.1);
            margin-top: 10px;
        }

        .neon-button:hover {
            background: rgba(0, 245, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 245, 255, 0.6),
                        inset 0 0 30px rgba(0, 245, 255, 0.2);
            transform: translateY(-2px);
        }

        .neon-button:active {
            transform: translateY(0);
        }

        .neon-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 245, 255, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .neon-button:hover::before {
            width: 400px;
            height: 400px;
        }

        .neon-button span {
            position: relative;
            z-index: 1;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .message.error {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff6b7a;
            display: block;
            animation: shake 0.5s ease-in-out;
        }

        .message.success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(0, 245, 255, 0.2);
            border-top: 3px solid #00f5ff;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 40px 30px;
            }

            .logo h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="login-container">
        <div class="logo">
            <h1>💎 E-Bank</h1>
            <p>Войдите в систему</p>
        </div>

        <form id="authForm">
            <div class="form-group">
                <label for="login">Логин</label>
                <input type="text" id="login" placeholder="Введите ваш логин" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Введите ваш пароль" required>
            </div>

            <div class="form-group">
                <button type="submit" class="neon-button">
                    <span>🔐 Войти</span>
                </button>
            </div>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <div class="message" id="message">{{ message }}</div>
        <div class="message error" id="error-message">{{ error }}</div>
    </div>

    <script>
        document.getElementById("authForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const loginBtn = e.target.querySelector('button');
            const loading = document.getElementById('loading');
            const messageEl = document.getElementById('message');
            const errorEl = document.getElementById('error-message');

            // Скрываем предыдущие сообщения
            messageEl.style.display = 'none';
            errorEl.style.display = 'none';

            // Показываем загрузку
            loading.classList.add('active');
            loginBtn.disabled = true;
            loginBtn.style.opacity = '0.6';

            const data = {
                login: document.getElementById("login").value,
                password: document.getElementById("password").value
            };

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data),
                    credentials: "include"
                });

                loading.classList.remove('active');
                loginBtn.disabled = false;
                loginBtn.style.opacity = '1';

                if (response.ok) {
                    messageEl.className = 'message success';
                    messageEl.textContent = '✅ Успешный вход! Перенаправление...';
                    messageEl.style.display = 'block';

                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                } else {
                    const error = await response.json();
                    errorEl.textContent = '❌ ' + (error.detail || 'Ошибка авторизации');
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                loading.classList.remove('active');
                loginBtn.disabled = false;
                loginBtn.style.opacity = '1';
                errorEl.textContent = '❌ Ошибка подключения к серверу';
                errorEl.style.display = 'block';
            }
        });

        // Обработка параметра error из URL
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        const errorEl = document.getElementById('error-message');

        if (error === 'invalid_credentials') {
            errorEl.textContent = '❌ Неверный логин или пароль';
            errorEl.style.display = 'block';
        }
    </script>
</body>
</html>
