<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Bank - Перевод средств</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0) translateX(0); 
                opacity: 0; 
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { 
                transform: translateY(-100vh) translateX(100px); 
                opacity: 0; 
            }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #00f5ff;
            text-decoration: none;
            margin-bottom: 30px;
            padding: 10px 20px;
            border: 1px solid rgba(0, 245, 255, 0.3);
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(0, 245, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
            transform: translateX(-5px);
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(13, 27, 42, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            font-size: 2.2em;
            background: linear-gradient(135deg, #00f5ff, #0080ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }

        .balance-info {
            background: rgba(0, 245, 255, 0.1);
            padding: 15px 25px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 10px;
            border: 1px solid rgba(0, 245, 255, 0.3);
        }

        .balance-info strong {
            color: #00ff88;
            font-size: 1.3em;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .form-container {
            background: rgba(13, 27, 42, 0.8);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(0, 245, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 30px;
            animation: slideIn 0.6s ease-out backwards;
        }

        .form-group:nth-child(1) {
            animation-delay: 0.3s;
        }

        .form-group:nth-child(2) {
            animation-delay: 0.4s;
        }

        .form-group:nth-child(3) {
            animation-delay: 0.5s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            display: block;
            margin-bottom: 12px;
            color: #8ba3b8;
            font-weight: 500;
            font-size: 1.05em;
        }

        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 18px 25px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 245, 255, 0.2);
            border-radius: 15px;
            color: #e0e0e0;
            font-size: 1.1em;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="number"]:focus,
        input[type="text"]:focus {
            border-color: #00f5ff;
            box-shadow: 0 0 25px rgba(0, 245, 255, 0.4);
            background: rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        .neon-button {
            width: 100%;
            padding: 20px;
            font-size: 1.2em;
            font-weight: 600;
            color: #00f5ff;
            background: transparent;
            border: 2px solid #00f5ff;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(0, 245, 255, 0.4),
                        inset 0 0 25px rgba(0, 245, 255, 0.1);
        }

        .neon-button:hover:not(:disabled) {
            background: rgba(0, 245, 255, 0.15);
            box-shadow: 0 0 50px rgba(0, 245, 255, 0.7),
                        inset 0 0 35px rgba(0, 245, 255, 0.2);
            transform: translateY(-3px);
        }

        .neon-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .neon-button:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .neon-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 245, 255, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .neon-button:hover:not(:disabled)::before {
            width: 500px;
            height: 500px;
        }

        .neon-button span {
            position: relative;
            z-index: 1;
        }

        #message {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.1em;
            display: none;
            animation: slideDown 0.5s ease-out;
        }

        #message.success {
            background: rgba(0, 255, 136, 0.15);
            border: 2px solid rgba(0, 255, 136, 0.4);
            color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
            display: block;
        }

        #message.error {
            background: rgba(255, 71, 87, 0.15);
            border: 2px solid rgba(255, 71, 87, 0.4);
            color: #ff6b7a;
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.2);
            display: block;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .loading-spinner {
            display: none;
            margin: 20px auto 0;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 245, 255, 0.2);
            border-top: 4px solid #00f5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-spinner.active {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .form-container {
                padding: 25px;
            }

            h1 {
                font-size: 1.8em;
            }

            input[type="number"],
            input[type="text"] {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <a href="/home" class="back-link">
            ← Вернуться в личный кабинет
        </a>

        <div class="header">
            <h1>💸 Перевод средств</h1>
            <div class="balance-info">
                {{ fullname }}, ваш баланс: <strong>{{ balance }} ₽</strong>
            </div>
        </div>

        <div class="form-container">
            <p style="color: #8ba3b8; margin-bottom: 30px; text-align: center; font-size: 1.05em;">
                Заполните форму для осуществления перевода средств
            </p>

            <form id="transactionForm">
                <div class="form-group">
                    <label for="amount">💰 Сумма перевода (₽)</label>
                    <input type="number" id="amount" name="amount" 
                           placeholder="Введите сумму" 
                           min="0.01" 
                           step="0.01" 
                           required>
                </div>

                <div class="form-group">
                    <label for="receiver_id">👤 ID получателя</label>
                    <input type="text" id="receiver_id" name="receiver_id" 
                           placeholder="Введите ID получателя" 
                           required>
                </div>

                <div class="form-group">
                    <button type="submit" class="neon-button" id="submitBtn">
                        <span>✨ Отправить перевод</span>
                    </button>
                </div>
            </form>

            <div class="loading-spinner" id="loadingSpinner"></div>
            <p id="message"></p>
        </div>
    </div>

    <script>
        // Создание анимированных частиц
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 5 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                
                particlesContainer.appendChild(particle);
            }
        }

        createParticles();

        // Обработка формы
        document.getElementById("transactionForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            
            const messageEl = document.getElementById("message");
            const submitBtn = document.getElementById("submitBtn");
            const loadingSpinner = document.getElementById("loadingSpinner");
            
            // Скрываем предыдущие сообщения
            messageEl.className = '';
            messageEl.style.display = 'none';
            
            // Показываем загрузку
            loadingSpinner.classList.add('active');
            submitBtn.disabled = true;
            
            const data = {
                amount: parseFloat(document.getElementById("amount").value),
                receiver_id: document.getElementById("receiver_id").value
            };
            
            let response;
            try {
                response = await fetch("/api/transaction", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify(data)
                });
            } catch (networkError) {
                loadingSpinner.classList.remove('active');
                submitBtn.disabled = false;
                
                messageEl.className = 'error';
                messageEl.textContent = "❌ Ошибка сети: " + networkError.message;
                messageEl.style.display = 'block';
                return;
            }
            
            loadingSpinner.classList.remove('active');
            submitBtn.disabled = false;
            
            if (response.ok) {
                const result = await response.json();
                messageEl.className = 'success';
                messageEl.textContent = "✅ Перевод успешно выполнен! Обновление страницы...";
                messageEl.style.display = 'block';
                
                setTimeout(() => {
                    window.location.reload();
                }, 1500);
            } else {
                let err;
                try {
                    err = await response.json();
                } catch {
                    messageEl.className = 'error';
                    messageEl.textContent = "❌ Ошибка сервера: некорректный ответ";
                    messageEl.style.display = 'block';
                    return;
                }
                
                messageEl.className = 'error';
                messageEl.textContent = `❌ Ошибка: ${err.error || err.detail || "Неизвестная ошибка"}`;
                messageEl.style.display = 'block';
            }
        });

        // Анимация при вводе
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
                this.parentElement.style.transition = 'transform 0.3s ease';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
