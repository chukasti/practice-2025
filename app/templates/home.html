<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Bank - Личный кабинет</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .grid-12 {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        header {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            background: rgba(13, 27, 42, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #00f5ff, #0080ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            text-shadow: 0 0 30px rgba(0, 245, 255, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }

        .user-info {
            grid-column: 1 / -1;
            background: rgba(13, 27, 42, 0.8);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 1.1em;
            color: #8ba3b8;
        }

        .info-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #00f5ff;
            text-shadow: 0 0 10px rgba(0, 245, 255, 0.5);
        }

        .balance-display {
            font-size: 2em !important;
            background: linear-gradient(135deg, #00f5ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .warning {
            grid-column: 1 / -1;
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            padding: 20px;
            border-radius: 15px;
            color: #ff6b7a;
            text-align: center;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .neon-button {
            position: relative;
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: 600;
            text-decoration: none;
            color: #00f5ff;
            background: transparent;
            border: 2px solid #00f5ff;
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3),
                        inset 0 0 20px rgba(0, 245, 255, 0.1);
        }

        .neon-button:hover {
            background: rgba(0, 245, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 245, 255, 0.6),
                        inset 0 0 30px rgba(0, 245, 255, 0.2);
            transform: translateY(-3px);
        }

        .neon-button:active {
            transform: translateY(-1px);
        }

        .neon-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 245, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .neon-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .neon-button span {
            position: relative;
            z-index: 1;
        }

        .logout-button {
            border-color: #ff4757;
            color: #ff4757;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.3),
                        inset 0 0 20px rgba(255, 71, 87, 0.1);
        }

        .logout-button:hover {
            background: rgba(255, 71, 87, 0.1);
            box-shadow: 0 0 40px rgba(255, 71, 87, 0.6),
                        inset 0 0 30px rgba(255, 71, 87, 0.2);
        }

        .logout-button::before {
            background: rgba(255, 71, 87, 0.3);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .info-row {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .actions {
                flex-direction: column;
            }

            .neon-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="grid-12">
            <header>
                <h1>💎 E-Bank</h1>
                <p style="color: #8ba3b8; font-size: 1.1em; margin-top: 10px;">Ваш цифровой банк будущего</p>
            </header>

            <div class="user-info">
                <div class="info-row">
                    <span class="info-label">Пользователь:</span>
                    <span class="info-value">{{ fullname }}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Баланс счета:</span>
                    <span class="info-value balance-display">{{ balance }} ₽</span>
                </div>
            </div>

            {% if restrict_warning %}
            <div class="warning">
                ⚠️ {{ restrict_warning }}
            </div>
            {% endif %}

            <div class="actions">
                <a href="/send_money" class="neon-button">
                    <span>💸 Перейти к переводу</span>
                </a>
                <form action="/api/logout" method="post" style="display: inline;">
                    <button type="submit" class="neon-button logout-button">
                        <span>🚪 Выйти из аккаунта</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Создание анимированных частиц
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 5 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                
                particlesContainer.appendChild(particle);
            }
        }

        createParticles();

        // Анимация при наведении на карточки
        document.querySelectorAll('.user-info, header').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                card.style.setProperty('--mouse-x', x + 'px');
                card.style.setProperty('--mouse-y', y + 'px');
            });
        });
    </script>
</body>
</html>
